<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">S&amp;P Connectair for Home Assistant</title>
  <desc id="desc">A quiet, sunlit room with a wall-mounted ventilation unit and soft streams of fresh air.</desc>
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f1e9"/>
      <stop offset="1" stop-color="#e6eee5"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff9e8"/>
      <stop offset="1" stop-color="#e7eadb"/>
    </linearGradient>
    <linearGradient id="unit" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fffefa"/>
      <stop offset="1" stop-color="#e6e4dc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
    <pattern id="grille" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M0 2h7" stroke="#989b8f" stroke-width="1.4" stroke-linecap="round" opacity=".55"/>
    </pattern>
  </defs>

  <rect width="1200" height="440" rx="30" fill="url(#room)"/>
  <circle cx="1015" cy="36" r="242" fill="url(#sun)" opacity=".8"/>
  <path d="M0 338c215-22 387-3 581 9 217 14 409-4 619-24v117H0z" fill="#d9dfd2" opacity=".55"/>
  <path d="M0 383c204-24 383-13 580-2 226 13 420-12 620-33" fill="none" stroke="#c7d0c4" stroke-width="2" opacity=".8"/>

  <!-- Soft window light -->
  <rect x="76" y="54" width="236" height="213" rx="14" fill="#cbdcd4" opacity=".62"/>
  <rect x="88" y="66" width="212" height="189" rx="9" fill="#edf2e9"/>
  <path d="M194 67v187M90 160h208" stroke="#bacbc1" stroke-width="7"/>
  <path d="M96 232c39-40 79-40 117-1 27-32 51-33 81-4v25H96z" fill="#c8d8c9" opacity=".8"/>
  <path d="M112 215c21-16 42-18 63-5m67-4c14-10 29-11 43-2" fill="none" stroke="#aec5b3" stroke-width="4" stroke-linecap="round"/>

  <!-- Wall-mounted ventilation unit -->
  <ellipse cx="746" cy="317" rx="196" ry="24" fill="#647265" opacity=".18" filter="url(#shadow)"/>
  <rect x="577" y="126" width="342" height="176" rx="23" fill="#d5d5cb" opacity=".45"/>
  <rect x="566" y="113" width="342" height="176" rx="23" fill="url(#unit)" stroke="#d7d7cd" stroke-width="3"/>
  <path d="M589 127h296" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".95"/>
  <rect x="603" y="220" width="266" height="39" rx="9" fill="#eeeee8"/>
  <rect x="623" y="231" width="145" height="18" rx="4" fill="url(#grille)"/>
  <circle cx="832" cy="240" r="5" fill="#607a63"/>
  <circle cx="832" cy="240" r="11" fill="#829984" opacity=".13"/>
  <path d="M593 274h287" stroke="#d4d5cb" stroke-width="2"/>
  <text x="737" y="179" fill="#596557" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="3" text-anchor="middle">FRESH AIR, MADE SIMPLE</text>

  <!-- Airflow lines -->
  <g fill="none" stroke="#779b89" stroke-linecap="round" opacity=".68">
    <path d="M583 329c-52 16-81 8-115-10-29-15-55-19-88-11" stroke-width="4"/>
    <path d="M626 345c-40 22-76 24-113 6-34-16-66-20-97-10" stroke-width="3" opacity=".8"/>
    <path d="M930 193c47-8 74-29 98-59 19-23 40-34 72-34" stroke-width="4"/>
    <path d="M930 214c37-3 62-18 83-40 18-18 38-26 64-26" stroke-width="3" opacity=".8"/>
  </g>
  <g fill="#789382" opacity=".7">
    <circle cx="402" cy="306" r="4"/><circle cx="432" cy="327" r="3"/><circle cx="1021" cy="92" r="4"/><circle cx="1050" cy="152" r="3"/>
  </g>

  <!-- A small indoor plant -->
  <path d="M1043 345h72l-9 49h-54z" fill="#b68061"/>
  <path d="M1054 344c7-38 2-64-16-84m41 84c-2-40 10-62 32-78m-38 77c12-29 9-50-2-68" fill="none" stroke="#66836a" stroke-width="6" stroke-linecap="round"/>
  <path d="M1039 271c-22-22-14-39 9-36 12 16 9 28-9 36m40-11c7-27 26-31 35-10-6 19-19 22-35 10m-10-7c-16-25-6-41 15-33 8 18 2 29-15 33" fill="#89a080"/>
  <path d="M1043 345h72" stroke="#976a52" stroke-width="3" opacity=".55"/>
</svg>
